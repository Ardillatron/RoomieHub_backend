spring.application.name=roomiehub

# Secretos locales (no van a git): copia local.properties.example a local.properties
spring.config.import=optional:file:./local.properties

# La app se conecta como app_user: no es dueño de las tablas, así que RLS la filtra (sección 9)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roomiehub_dev}
spring.datasource.username=${DB_USER:app_user}
spring.datasource.password=${DB_PASSWORD}

# Las migraciones corren con el rol dueño del esquema
spring.flyway.user=${DB_OWNER_USER:roomiehub_owner}
spring.flyway.password=${DB_OWNER_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT propio (HS256, al menos 32 bytes) y client IDs de Google Sign-In separados por comas
app.jwt.secreto=${JWT_SECRET}
app.google.client-ids=${GOOGLE_CLIENT_IDS:}

# Detrás del proxy de Render: toma la IP real de X-Forwarded-For (límite de /auth por IP)
server.port=${PORT:8080}
server.forward-headers-strategy=native
app.limite.auth-por-ip-por-minuto=30

# Procesos programados (sección 12): cron mientras la instancia está despierta y un disparador externo
# que llama a POST /internal/jobs/ejecutar con el encabezado X-Jobs-Secret. Sin secreto, el endpoint no existe.
app.jobs.cron=${JOBS_CRON:0 */15 * * * *}
app.jobs.secreto=${JOBS_SECRET:}

# Imágenes (AlmacenamientoImagenesPort): la "API environment variable" de Cloudinary,
# cloudinary://key:secret@cloud_name. Vacía = las imágenes responden 503.
app.cloudinary.url=${CLOUDINARY_URL:}

# Push (sección 10): ruta al JSON de la cuenta de servicio de Firebase. Vacía = las notificaciones solo van al log.
# En Render va como Secret File (/etc/secrets/...).
app.firebase.credenciales=${FIREBASE_CREDENTIALS:}
